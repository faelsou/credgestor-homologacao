version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    configs:
      # Usar Docker Config para o arquivo prometheus.yml
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        uid: '65534'
        gid: '65534'
        mode: 0644
    volumes:
      # Volume para persistência de dados
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - prometheus_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.credgestor.app.br`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

configs:
  prometheus_config:
    # O conteúdo do prometheus.yml será inserido aqui via Portainer
    # No Portainer, você pode criar este config manualmente ou usar o editor
    external: false
    # Se já tiver um config criado, use:
    # external: true
    # name: prometheus_config

volumes:
  prometheus_data:
    driver: local

networks:
  prometheus_net:
    driver: bridge
    # Se quiser conectar à rede do CredGestor, descomente e ajuste:
    # external: true
    # name: credgestor_default
