version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # IMPORTANTE: Crie este arquivo na VPS antes de fazer deploy
      # sudo mkdir -p /var/www/prometheus
      # sudo nano /var/www/prometheus/prometheus.yml
      # Cole o conteúdo do arquivo prometheus.yml ou prometheus-simples.yml
      - /var/www/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Volume para persistência de dados
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - prometheus_net

volumes:
  prometheus_data:
    driver: local

networks:
  prometheus_net:
    driver: bridge
