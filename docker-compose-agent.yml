version: '3.9'

services:
  agent:
    # Usar imagem do backend como base, mas instalar dependências do agente
    image: faelsouz/credgestor-homologacao-backend:${DOCKER_VERSION:-latest}
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-#credgestor-agent}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Modelo LLM - claude-sonnet-4-5 (modelos claude-3-5-* foram aposentados)
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-5}
      - DOCKER_STACK=${DOCKER_STACK:-credgestor}
      - API_URL=${API_URL:-http://api:8000}
      - API_HEALTH_ENDPOINT=${API_HEALTH_ENDPOINT:-/health}
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-3600}
      - SEND_HEALTHY_STATUS=${SEND_HEALTHY_STATUS:-true}
      - HEALTHY_STATUS_INTERVAL=${HEALTHY_STATUS_INTERVAL:-3600}
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-true}
      # Timeout menor que REALERT_INTERVAL para que o lembrete do incidente
      # reabra o pedido de aprovação em vez de encontrá-lo ainda pendente
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-600}
      - REALERT_INTERVAL=${REALERT_INTERVAL:-900}
      - FRONTEND_URL=${FRONTEND_URL:-http://site:80}
      - DOCS_DIR=/app/docs/troubleshooting
      - AGENT_HTTP_PORT=8085
    # Executar como root para evitar problemas de permissão ao instalar pacotes
    user: root
    volumes:
      - ./agent:/app/agent:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docs/troubleshooting:/app/docs/troubleshooting
    # Instalar dependências do agente antes de executar
    command: sh -c "pip install --no-cache-dir -q pydantic-settings>=2.0.0 anthropic>=0.18.0 openai>=1.0.0 requests>=2.31.0 docker>=6.1.0 psycopg2-binary>=2.9.0 && python3 -m agent.main"
    # Conectar à rede do Swarm para acessar outros serviços
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        # Receptor de aprovações do Slack, exposto fora da API para continuar
        # acessível quando o serviço credgestor_api estiver indisponível
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.credgestor-agent-secure.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`) && PathPrefix(`/agent`)"
        - "traefik.http.routers.credgestor-agent-secure.entrypoints=websecure"
        - "traefik.http.routers.credgestor-agent-secure.tls=true"
        - "traefik.http.routers.credgestor-agent-secure.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.credgestor-agent-secure.service=credgestor-agent"
        - "traefik.http.routers.credgestor-agent-secure.middlewares=credgestor-agent-stripprefix"
        - "traefik.http.middlewares.credgestor-agent-stripprefix.stripprefix.prefixes=/agent"
        # A Request URL histórica do Slack App (/api/slack/interactions) também
        # é servida pelo agente: prioridade acima da rota PathPrefix(/api) da API
        - "traefik.http.routers.credgestor-agent-interactions.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`) && Path(`/api/slack/interactions`)"
        - "traefik.http.routers.credgestor-agent-interactions.entrypoints=websecure"
        - "traefik.http.routers.credgestor-agent-interactions.tls=true"
        - "traefik.http.routers.credgestor-agent-interactions.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.credgestor-agent-interactions.priority=1000"
        - "traefik.http.routers.credgestor-agent-interactions.service=credgestor-agent"
        - "traefik.http.routers.credgestor-agent-interactions.middlewares=credgestor-agent-apistrip"
        - "traefik.http.middlewares.credgestor-agent-apistrip.stripprefix.prefixes=/api"
        - "traefik.http.services.credgestor-agent.loadbalancer.server.port=8085"

networks:
  network_public:
    external: true
