# Configuração do Prometheus para coletar métricas do CredGestor
# Adicione este job ao seu arquivo prometheus.yml do stack observability

scrape_configs:
  # ... outros jobs existentes (cadvisor, node_exporter, etc.) ...
  
  # Job para coletar métricas da API CredGestor
  - job_name: 'credgestor-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      # Opção 1: Se a API está na mesma rede Docker
      - targets: ['credgestor_api:8000']
        labels:
          service: 'credgestor-api'
          environment: 'production'
      
      # Opção 2: Se a API está acessível externamente (descomente se necessário)
