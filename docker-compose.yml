version: '3.8'

services:
  # Banco de dados PostgreSQL local (opcional - use se não tiver Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: credgestor-db
    environment:
      POSTGRES_DB: credgestor
      POSTGRES_USER: credgestor_user
      POSTGRES_PASSWORD: credgestor_pass_123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credgestor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credgestor_user -d credgestor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API FastAPI (Backend)
  api:
    # Usar imagem do Docker Hub (recomendado para produção)
    image: faelsouz/credgestor-homologacao-backend:latest
    # Ou build local (descomente para desenvolvimento)
    # build:
    #   context: .
    #   dockerfile: Dockerfile.backend
    container_name: credgestor-api
    env_file:
      - .env  # Carrega variáveis de ambiente do arquivo .env
    environment:
      # Usar banco local (descomente se usar PostgreSQL local)
      # DATABASE_URL: postgresql://credgestor_user:credgestor_pass_123@postgres:5432/credgestor
      
      # ⚠️  NÃO coloque credenciais aqui! Use o arquivo .env
      # As seguintes variáveis devem estar no .env:
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - SUPABASE_ANON_KEY (opcional)
      # - DATABASE_URL (para código legacy, se necessário)
      
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - credgestor-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React + Vite
  frontend:
    # Usar imagem do Docker Hub (recomendado para produção)
    image: faelsouz/credgestor-homologacao-frontend:latest
    # Ou build local (descomente para desenvolvimento)
    # build:
    #   context: .
    #   dockerfile: Dockerfile.frontend
    #   args:
    #     VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
    #     VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: credgestor-frontend
    ports:
      - "3000:80"
    networks:
      - credgestor-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PgAdmin (Opcional - Interface web para gerenciar PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: credgestor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@credgestor.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - credgestor-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  credgestor-network:
    driver: bridge

# ===================================================================
# INSTRUÇÕES DE USO
# ===================================================================
#
# 1. Iniciar todos os serviços:
#    docker-compose up -d
#
# 2. Ver logs:
#    docker-compose logs -f api
#
# 3. Parar todos os serviços:
#    docker-compose down
#
# 4. Parar e remover volumes (CUIDADO: apaga o banco):
#    docker-compose down -v
#
# 5. Acessar serviços:
#    - API: http://localhost:8000
#    - API Docs: http://localhost:8000/docs
#    - PgAdmin: http://localhost:5050
#
# 6. Executar comando no container:
#    docker-compose exec api python -m backend.legacy.create_tables
#
# 7. Conectar no banco via PgAdmin:
#    - Host: postgres
#    - Port: 5432
#    - Username: credgestor_user
#    - Password: credgestor_pass_123
#    - Database: credgestor
#
# ===================================================================
