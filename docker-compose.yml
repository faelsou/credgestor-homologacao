version: '3.8'

services:
  # Banco de dados PostgreSQL local (opcional - use se não tiver Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: credgestor-db
    environment:
      POSTGRES_DB: credgestor
      POSTGRES_USER: credgestor_user
      POSTGRES_PASSWORD: credgestor_pass_123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credgestor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credgestor_user -d credgestor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credgestor-api
    environment:
      # Usar banco local
      # DATABASE_URL: postgresql://credgestor_user:credgestor_pass_123@postgres:5432/credgestor
      
      # Ou usar Supabase
      DATABASE_URL: postgresql://postgres:KydFq3qOLj5kOi4V@db.aclyrcuahiujgtjuimoh.supabase.co:5432/postgres
      
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - credgestor-network
    command: uvicorn backend.legacy.api_rest:app --host 0.0.0.0 --port 8000 --reload

  # PgAdmin (Opcional - Interface web para gerenciar PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: credgestor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@credgestor.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - credgestor-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  credgestor-network:
    driver: bridge

# ===================================================================
# INSTRUÇÕES DE USO
# ===================================================================
#
# 1. Iniciar todos os serviços:
#    docker-compose up -d
#
# 2. Ver logs:
#    docker-compose logs -f api
#
# 3. Parar todos os serviços:
#    docker-compose down
#
# 4. Parar e remover volumes (CUIDADO: apaga o banco):
#    docker-compose down -v
#
# 5. Acessar serviços:
#    - API: http://localhost:8000
#    - API Docs: http://localhost:8000/docs
#    - PgAdmin: http://localhost:5050
#
# 6. Executar comando no container:
#    docker-compose exec api python -m backend.legacy.create_tables
#
# 7. Conectar no banco via PgAdmin:
#    - Host: postgres
#    - Port: 5432
#    - Username: credgestor_user
#    - Password: credgestor_pass_123
#    - Database: credgestor
#
# ===================================================================
