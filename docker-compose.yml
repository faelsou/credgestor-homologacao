version: '3.9'

services:
  # API FastAPI (Backend)
  api:
    # Usar imagem do Docker Hub com versão específica
    # Versão atual: v1.0.13 (atualizar VERSION ao fazer mudanças)
    image: faelsouz/credgestor-homologacao-backend:${DOCKER_VERSION:-latest}
    # container_name não é suportado em Docker Swarm (docker stack deploy)
    # container_name: credgestor-api
    # env_file funciona com docker-compose, mas não com docker stack deploy
    # Para docker stack deploy, use: source .env && docker stack deploy -c docker-compose.yml credgestor
    env_file:
      - .env  # Carrega variáveis de ambiente do arquivo .env (docker-compose apenas)
    environment:
      # ⚠️  NÃO coloque credenciais aqui! Use secrets do Docker Swarm ou arquivo .env
      # As variáveis serão carregadas do arquivo .env na VPS antes do deploy
      # As seguintes variáveis devem estar no .env ou no ambiente:
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - SUPABASE_ANON_KEY (opcional)
      # - DATABASE_URL (para código legacy, se necessário)
      
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # DATABASE_URL é opcional - só necessário para código legacy
      # Use a connection string do Supabase se precisar do código legacy
      # Exemplo: postgresql://postgres:password@db.project.supabase.co:5432/postgres
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "8000:8000"
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        
        # Roteamento da API via Traefik
        # HTTP -> HTTPS redirect para API
        - traefik.http.routers.credgestor-api-web.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`) && PathPrefix(`/api`)
        - traefik.http.routers.credgestor-api-web.entrypoints=web
        - traefik.http.routers.credgestor-api-web.middlewares=credgestor-api-https-redirect
        - traefik.http.middlewares.credgestor-api-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.credgestor-api-https-redirect.redirectscheme.permanent=true
        - traefik.http.routers.credgestor-api-web.service=credgestor-api
        
        # HTTPS para API
        - traefik.http.routers.credgestor-api-secure.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`) && PathPrefix(`/api`)
        - traefik.http.routers.credgestor-api-secure.entrypoints=websecure
        - traefik.http.routers.credgestor-api-secure.tls=true
        - traefik.http.routers.credgestor-api-secure.tls.certresolver=letsencryptresolver
        - traefik.http.routers.credgestor-api-secure.service=credgestor-api
        - traefik.http.routers.credgestor-api-secure.tls.domains[0].main=credgestor.app.br
        - traefik.http.routers.credgestor-api-secure.tls.domains[0].sans=www.credgestor.app.br
        
        # Middleware para remover o prefixo /api antes de encaminhar para o backend
        - traefik.http.middlewares.credgestor-api-stripprefix.stripprefix.prefixes=/api
        - traefik.http.routers.credgestor-api-secure.middlewares=credgestor-api-stripprefix
        
        # Serviço da API
        - traefik.http.services.credgestor-api.loadbalancer.server.port=8000
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React + Vite (Site)
  site:
    # Usar imagem do Docker Hub com versão específica
    # Versão atual: v1.0.13 (atualizar VERSION ao fazer mudanças)
    image: faelsouz/credgestor-homologacao-frontend:${DOCKER_VERSION:-latest}
    # container_name não é suportado em Docker Swarm (docker stack deploy)
    # container_name: credgestor-frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public

        # HTTP -> HTTPS
        - traefik.http.routers.credgestor-web.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`)
        - traefik.http.routers.credgestor-web.entrypoints=web
        - traefik.http.routers.credgestor-web.middlewares=credgestor-https-redirect
        - traefik.http.middlewares.credgestor-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.credgestor-https-redirect.redirectscheme.permanent=true
        - traefik.http.routers.credgestor-web.service=credgestor

        # HTTPS
        - traefik.http.routers.credgestor-secure.rule=Host(`credgestor.app.br`,`www.credgestor.app.br`)
        - traefik.http.routers.credgestor-secure.entrypoints=websecure
        - traefik.http.routers.credgestor-secure.tls=true
        - traefik.http.routers.credgestor-secure.tls.certresolver=letsencryptresolver
        - traefik.http.routers.credgestor-secure.service=credgestor
        - traefik.http.routers.credgestor-secure.tls.domains[0].main=credgestor.app.br
        - traefik.http.routers.credgestor-secure.tls.domains[0].sans=www.credgestor.app.br

        # Porta interna do Nginx
        - traefik.http.services.credgestor.loadbalancer.server.port=80

    networks:
      - network_public
    # depends_on não funciona em Docker Swarm - use deploy.placement.constraints se necessário
    # depends_on:
    #   - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  network_public:
    external: true

# ===================================================================
# INSTRUÇÕES DE USO
# ===================================================================
#
# 1. Iniciar todos os serviços:
#    docker-compose up -d
#    # OU para produção com Docker Swarm:
#    docker stack deploy -c docker-compose.yml credgestor
#
# 2. Ver logs:
#    docker-compose logs -f api
#    docker-compose logs -f site
#    # OU para Docker Swarm:
#    docker service logs -f credgestor_api
#    docker service logs -f credgestor_site
#
# 3. Parar todos os serviços:
#    docker-compose down
#    # OU para Docker Swarm:
#    docker stack rm credgestor
#
# 4. Acessar serviços:
#    - API: http://localhost:8000
#    - API Docs: http://localhost:8000/docs
#    - Frontend: https://credgestor.app.br (via Traefik)
#
# 5. Executar comando no container:
#    docker-compose exec api python -m backend.legacy.create_tables
#    # OU para Docker Swarm:
#    docker service ps credgestor_api --no-trunc
#    docker exec $(docker ps -q -f name=credgestor_api) python -m backend.legacy.create_tables
#
# ===================================================================
# NOTAS
# ===================================================================
#
# - Este docker-compose está configurado para produção com Traefik
# - Usa Supabase como banco de dados (não há PostgreSQL local)
# - A imagem de homologação é mantida conforme solicitado
# - pgAdmin foi removido pois não é necessário com Supabase
# - Compatível com docker-compose e docker stack deploy (Docker Swarm)
# - Para usar env_file com docker stack deploy, configure secrets do Docker Swarm
#   ou use variáveis de ambiente diretamente no arquivo
#
# ===================================================================
