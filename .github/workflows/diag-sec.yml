name: diag-sec
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          mkdir -p out
          printf "%s" "${{ secrets.VPS_HOST }}" > out/VPS_HOST
          printf "%s" "${{ secrets.VPS_USER }}" > out/VPS_USER
          printf "%s" "${{ secrets.VPS_SSH_KEY }}" > out/VPS_SSH_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out
